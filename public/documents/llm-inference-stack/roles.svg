<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" fill="none">
  <rect width="960" height="320" rx="20" fill="#0a0f1e"/>
  <text x="40" y="48" fill="#64748b" font-family="ui-sans-serif,system-ui" font-size="13" letter-spacing="2">PRIMARY ROLES</text>
