  <text x="28" y="68" class="term" fill="#a6e3a1">afsalashraf@MacBookPro scripts % ./06-test-inference.sh</text><text x="28" y="86" class="term" fill="#f9e2af">==&gt; Health: http://20.121.181.131:8000/v1/health/ready</text><text x="28" y="104" class="term" fill="#cdd6f4">{&quot;object&quot;:&quot;health.response&quot;,&quot;message&quot;:&quot;Service is ready.&quot;}</text><text x="28" y="122" class="term" fill="#cdd6f4"></text><text x="28" y="140" class="term" fill="#f9e2af">==&gt; Chat completion</text><text x="28" y="158" class="term" fill="#cdd6f4">model: meta/llama-3.2-1b-instruct</text><text x="28" y="176" class="term" fill="#cdd6f4">finish_reason: stop</text><text x="28" y="194" class="term" fill="#cdd6f4">usage: prompt=47 completion=162</text><text x="28" y="212" class="term" fill="#cdd6f4"></text><text x="28" y="230" class="term" fill="#cdd6f4">assistant:</text><text x="28" y="248" class="term" fill="#cdd6f4">Here are three short bullet points explaining Kubernetes GPU scheduling:</text><text x="28" y="266" class="term" fill="#cdd6f4"></text><text x="28" y="284" class="term" fill="#cdd6f4">• GPU acceleration: Kubernetes can schedule containers that request nvidia.com/gpu</text><text x="28" y="302" class="term" fill="#cdd6f4">  onto nodes where the device plugin advertises allocatable GPUs.</text><text x="28" y="320" class="term" fill="#cdd6f4">• GPU scheduling: the scheduler only places pods when nvidia.com/gpu capacity is free.</text><text x="28" y="338" class="term" fill="#cdd6f4">• GPU resource management: taints/tolerations keep non-GPU workloads off GPU nodes.</text><text x="28" y="356" class="term" fill="#cdd6f4"></text><text x="28" y="374" class="term" fill="#a6e3a1">afsalashraf@MacBookPro scripts % </text>
