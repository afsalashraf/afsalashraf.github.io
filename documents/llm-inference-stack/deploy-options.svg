  <rect x="664" y="368" width="240" height="40" rx="10" fill="#0a0f1e" stroke="#34d399" stroke-opacity="0.35"/>
  <text x="784" y="393" text-anchor="middle" fill="#86efac" font-size="12" font-family="ui-sans-serif,system-ui">NVIDIA GPU + CUDA</text>
  <text x="664" y="438" fill="#94a3b8" font-size="12" font-family="ui-sans-serif,system-ui">Enterprise packaged deploy</text>
