<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc">
  <title id="title">NVIDIA stack layers on AKS</title>
  <desc id="desc">Layered stack from Chat UI down through NIM, GPU Operator, and NVIDIA GPU hardware.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11111b"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1100" height="480" rx="20" fill="url(#bg)"/>

  <text x="40" y="42" font-family="Segoe UI,Helvetica Neue,sans-serif" font-size="24" font-weight="700" fill="#cdd6f4">NVIDIA stack on AKS</text>
  <text x="40" y="68" font-family="SF Mono,Menlo,monospace" font-size="13" fill="#a6adc8">Layers cooperate — they are not competing products</text>

  <!-- Layer cards stacked -->
  <!-- L5 App -->
  <g filter="url(#soft)">
    <rect x="80" y="100" width="940" height="58" rx="14" fill="#181825" stroke="#f5c2e7" stroke-width="2"/>
  </g>
  <rect x="80" y="100" width="10" height="58" rx="4" fill="#f5c2e7"/>
  <text x="110" y="125" font-family="Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#f5c2e7">L5 · APPLICATION</text>
  <text x="110" y="145" font-family="Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#cdd6f4">Chat UI  ·  curl  ·  your service</text>
  <text x="980" y="135" text-anchor="end" font-family="SF Mono,Menlo,monospace" font-size="12" fill="#a6adc8">OpenAI HTTP</text>

  <!-- connector -->
  <line x1="550" y1="158" x2="550" y2="172" stroke="#585b70" stroke-width="2"/>

  <!-- L4 NIM -->
  <g filter="url(#soft)">
    <rect x="80" y="172" width="940" height="58" rx="14" fill="#181825" stroke="#94e2d5" stroke-width="2"/>
  </g>
  <rect x="80" y="172" width="10" height="58" rx="4" fill="#94e2d5"/>
  <text x="110" y="197" font-family="Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#94e2d5">L4 · INFERENCE MICROSERVICE</text>
  <text x="110" y="217" font-family="Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#cdd6f4">NVIDIA NIM</text>
  <text x="980" y="207" text-anchor="end" font-family="SF Mono,Menlo,monospace" font-size="12" fill="#a6adc8">/v1/chat/completions</text>

  <line x1="550" y1="230" x2="550" y2="244" stroke="#585b70" stroke-width="2"/>

  <!-- L3 Engine -->
  <g filter="url(#soft)">
    <rect x="80" y="244" width="940" height="58" rx="14" fill="#181825" stroke="#89b4fa" stroke-width="2"/>
  </g>
  <rect x="80" y="244" width="10" height="58" rx="4" fill="#89b4fa"/>
  <text x="110" y="269" font-family="Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#89b4fa">L3 · ACCELERATION ENGINE (INSIDE NIM)</text>
  <text x="110" y="289" font-family="Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#cdd6f4">TensorRT-LLM / vLLM-class runtime</text>
  <text x="980" y="279" text-anchor="end" font-family="SF Mono,Menlo,monospace" font-size="12" fill="#a6adc8">batching · KV</text>

  <line x1="550" y1="302" x2="550" y2="316" stroke="#585b70" stroke-width="2"/>

  <!-- L2 Operator -->
  <g filter="url(#soft)">
    <rect x="80" y="316" width="940" height="58" rx="14" fill="#181825" stroke="#f9e2af" stroke-width="2"/>
  </g>
  <rect x="80" y="316" width="10" height="58" rx="4" fill="#f9e2af"/>
  <text x="110" y="341" font-family="Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#f9e2af">L2 · GPU ENABLEMENT</text>
  <text x="110" y="361" font-family="Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#cdd6f4">GPU Operator → CUDA · driver · device plugin</text>
  <text x="980" y="351" text-anchor="end" font-family="SF Mono,Menlo,monospace" font-size="12" fill="#a6adc8">nvidia.com/gpu</text>

  <line x1="550" y1="374" x2="550" y2="388" stroke="#585b70" stroke-width="2"/>

  <!-- L1 Hardware -->
  <g filter="url(#soft)">
    <rect x="80" y="388" width="940" height="58" rx="14" fill="#181825" stroke="#a6e3a1" stroke-width="2"/>
  </g>
  <rect x="80" y="388" width="10" height="58" rx="4" fill="#a6e3a1"/>
  <text x="110" y="413" font-family="Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#a6e3a1">L1 · HARDWARE</text>
  <text x="110" y="433" font-family="Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#cdd6f4">NVIDIA GPU  ·  T4 / A100 / H100 …</text>
  <text x="980" y="423" text-anchor="end" font-family="SF Mono,Menlo,monospace" font-size="12" fill="#a6adc8">VRAM + FLOPs</text>
</svg>
